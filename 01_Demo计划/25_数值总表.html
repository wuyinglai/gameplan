function guardHtml(){

  h += `<p class="rnote">这层是给程序用的 —— <b>主旋钮随便拧，越界由程序拉回来并告诉你它动了哪几个</b>。范围本身也可改（它是设计意图的编码，不是物理定律）。</p>`;
  h += `<div class="wrap"><table><thead><tr><th>类别</th><th>项目</th><th>合理范围</th><th>按现值算</th><th>状态</th><th>越界说明</th></tr></thead><tbody>`;
  G.forEach(r=>{
    h += `<tr><td class="id">${r[0]}</td><td>${r[1]}</td><td class="val">${r[2]}</td>
      <td class="val">${r[3]}</td><td><span class="tag ${cls(r[4])}">${lab(r[4])}</span></td>
      <td class="src" style="white-space:normal">${r[5]}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

const main = document.getElementById('main');
const state = { f:'all', q:'' };

function render(){
  let html = '', nOk=0, nWarn=0, nTodo=0, nAll=0;
  html += guardHtml();
  D.forEach(gr=>{
    const rows = gr.rows.filter(r=>{
      if(state.f==='ok' && r[3]!=='ok') return false;
      if(state.f==='warn' && r[3]!=='warn') return false;
      if(state.f==='todo' && r[3]!=='todo') return false;
      if(state.q){
        const t = (r[1]+r[2]+r[4]).toLowerCase();
        if(t.indexOf(state.q.toLowerCase())<0) return false;
      }
      return true;
    });
    gr.rows.forEach(r=>{ nAll++; if(r[3]==='ok') nOk++; else if(r[3]==='warn') nWarn++; else nTodo++; });
    if(!rows.length) return;
    const cOk = rows.filter(r=>r[3]==='ok').length;
    const cW  = rows.filter(r=>r[3]==='warn').length;
    const cT  = rows.filter(r=>r[3]==='todo').length;
    html += `<h2>${gr.g}<span class="cnt">${rows.length} 项 · 已定 ${cOk} / 冲突 ${cW} / 未定 ${cT}</span></h2>`;
    if(gr.note) html += `<p class="rnote">${gr.note}</p>`;
    html += `<div class="wrap"><table><thead><tr><th>#</th><th>数值项</th><th>当前值</th><th>状态</th><th>出处</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const lab = r[3]==='ok' ? '已定' : (r[3]==='warn' ? '冲突' : '未定');
      html += `<tr data-s="${r[3]}"><td class="id">${r[0]}</td><td>${r[1]}</td>
        <td class="val">${r[2]||'—'}</td><td><span class="tag ${r[3]}">${lab}</span></td>
        <td class="src">${r[4]||''}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  });
  main.innerHTML = html;
  document.getElementById('cOk').textContent   = nOk;
  document.getElementById('cWarn').textContent = nWarn;
  document.getElementById('cTodo').textContent = nTodo;
  document.getElementById('cAll').textContent  = nAll;
  document.getElementById('prog').style.width  = (nOk/nAll*100).toFixed(1)+'%';
}

document.querySelectorAll('button[data-f]').forEach(b=>b.addEventListener('click',()=>{
  state.f = b.dataset.f;
  document.querySelectorAll('button[data-f]').forEach(x=>x.classList.toggle('on', x===b));
  render();
}));
document.getElementById('q').addEventListener('input', e=>{ state.q = e.target.value; render(); });
render();
</script>
